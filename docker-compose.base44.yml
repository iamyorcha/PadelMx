services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://localhost:3000/api/health'),fetch('http://localhost:3000/')]).then(rs=>{if(!rs.every(r=>r.ok))throw 0}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
